<style>
  .sg-text { margin-bottom: 16px; }
</style>

<div id="sg-view" style="min-height: 440px;">
<p class="sg-text homey-subtitle" id="sg-text"></p>
<button class="homey-button-primary-full" id="sg-again" hidden></button>
</div>

<script type="application/javascript">
  // The web app sizes the view once, when it loads and is still empty. Claim
  // the height up front, as in the group's member view.
  document.documentElement.style.minHeight = '440px';
  document.body.style.minHeight = '440px';

  const text = document.getElementById('sg-text');
  const again = document.getElementById('sg-again');
  again.textContent = Homey.__('pair.search.again');

  // Opens the list only when there is a new dimmer. Otherwise the view stays,
  // with its own title and text, and the user can search again or close.
  function show(title, message) {
    Homey.setTitle(title);
    text.textContent = message;
    again.hidden = false;
    again.classList.remove('is-loading');
    Homey.setNavigationClose();
  }

  function search() {
    Homey.setTitle(Homey.__('pair.search.title'));
    text.textContent = Homey.__('pair.search.wait');
    again.classList.add('is-loading');
    Homey.emit('search').then(({ reason }) => {
      if (reason === 'none') show(Homey.__('pair.search.noneTitle'), Homey.__('pair.search.noneText'));
      else if (reason === 'allAdded') show(Homey.__('pair.search.allAddedTitle'), Homey.__('pair.allAlreadyAdded'));
      else Homey.showView('list_devices');
    }).catch((err) => {
      show(Homey.__('pair.search.failedTitle'), Homey.__('pair.search.failedText', { error: (err && err.message) || String(err) }));
    });
  }

  again.addEventListener('click', search);
  search();
</script>
