<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
</head>
<body>
  <fieldset>
    <div class="field row">
      <label for="keepConnected" data-i18n="settings.keepConnected.label">Keep dimmers connected</label>
      <input id="keepConnected" type="checkbox">
    </div>
    <p data-i18n="settings.keepConnected.hint">Faster connection. Blocks the SG app if you have only one dimmer.</p>
  </fieldset>

  <fieldset>
    <legend data-i18n="settings.troubleshooting.title">Troubleshooting</legend>
    <div class="field row">
      <label for="debugLogging" data-i18n="settings.troubleshooting.debug">Detailed logging</label>
      <input id="debugLogging" type="checkbox">
    </div>
  </fieldset>

  <script>
    function onHomeyReady(Homey) {
      const keepConnected = document.getElementById('keepConnected');
      const debug = document.getElementById('debugLogging');

      const get = (key) => new Promise((resolve, reject) => {
        Homey.get(key, (err, value) => (err ? reject(err) : resolve(value)));
      });
      const set = (key, value) => new Promise((resolve, reject) => {
        Homey.set(key, value, (err) => (err ? reject(err) : resolve()));
      });
      const fail = (err) => Homey.alert(String((err && err.message) || err));

      // Unset, "Keep dimmers connected" follows the number of dimmers; the app
      // keeps that default in keepConnectedDefault. Each box saves at once.
      Promise.all([get('keepConnected'), get('keepConnectedDefault'), get('debugLogging')])
        .then(([choice, byDefault, debugEnabled]) => {
          keepConnected.checked = typeof choice === 'boolean' ? choice : byDefault === true;
          debug.checked = debugEnabled === true;
          Homey.ready();
        })
        .catch((err) => {
          fail(err);
          Homey.ready();
        });

      keepConnected.addEventListener('change', () => set('keepConnected', keepConnected.checked).catch(fail));
      debug.addEventListener('change', () => set('debugLogging', debug.checked).catch(fail));
    }
  </script>
</body>
</html>
